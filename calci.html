        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
        <script src = "https://cdn.jsdelivr.net/npm/mathjs@15.1.1/lib/browser/math.min.js"></script>

        <script>

            var angleMode = "DEG"; // default mode

            function toggleMode() {
                if (angleMode === "DEG") {
                    angleMode = "RAD";
                    document.getElementById("modeBtn").innerText = "RAD";
                } else {
                    angleMode = "DEG";
                    document.getElementById("modeBtn").innerText = "DEG";
                }
            }

            function addLog(msg){
                var ul = document.getElementById("log");
                var li = document.createElement("li");
                var msg_text_node = document.createTextNode(msg);
                li.appendChild(msg_text_node);
                ul.appendChild(li);
            }

            function calculate(){
                var expression = document.getElementById("expression").value;
                console.log(expression); //for the console msg
                if(expression){
                    try{
                        //answer = math.evaluate(expression); // eval evaluates the string expression and returns the answer
                        //document.getElementById("expression").value = answer; //display the answer in the input box
                        //addLog(expression + " = " + answer); //log the expression and answer in the log
                        var answer;

                        if (angleMode === "DEG") {
                            answer = math.evaluate(expression, {
                                sin: function(x) { return Math.sin(x * Math.PI / 180); },
                                cos: function(x) { return Math.cos(x * Math.PI / 180); },
                                tan: function(x) { return Math.tan(x * Math.PI / 180); }
                            });
                        } else {
                            answer = math.evaluate(expression); // RAD mode (default math.js behavior)
                        }
                        //var answer = math.evaluate(expression);
                        if (answer === Infinity || answer === -Infinity) {
                            answer = "Cannot divide by zero";
                        }
                        document.getElementById("expression").value = answer;
                        addLog(expression + " = " + answer);

                    } catch(e){
                        document.getElementById("expression").value = "Invalid Input"; //display error if expression is invalid
                        console.log("Bad Expression");
                        addLog(expression + " is a bad expression. Please fix it."); //log the bad expression in the log
                    }
                }
            }


            function input_number(v){
                var expression = document.getElementById("expression").value;
                expression += v;
                document.getElementById("expression").value = expression;
            }

            function input_operator(o){
                var expression = document.getElementById("expression").value;
                expression += o;
                document.getElementById("expression").value = expression;
            }

            function clear_input(){
                document.getElementById("expression").value = "";
            }

            function backspace(){
                var expression = document.getElementById("expression").value;
                expression = expression.slice(0, -1); //remove the last character from the expression   
                document.getElementById("expression").value = expression;
            }
        </script>
    </head>
